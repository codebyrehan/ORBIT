name: Production Release Gate

on:
  push:
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      ORBIT_RATE_LIMIT_PER_MINUTE: "120"
      ORBIT_RATE_LIMIT_BURST: "20"
      ORBIT_DATA_DIR: /var/lib/orbit
      ORBIT_ENABLE_DEMO_MODEL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Generate ephemeral release token
        run: echo "ORBIT_API_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: docker build -t orbit-ai:release .
      - name: Prepare durable state
        run: |
          mkdir -p release-data
          printf '%s\n' '{"request_id":"release-gate-request","model_id":"demo-model","runtime_name":"cpu","state":"completed","tokens":7}' > release-data/requests.jsonl
      - name: Start release container
        run: docker run -d --name orbit-release -p 8787:8787 -e ORBIT_API_TOKEN -e ORBIT_RATE_LIMIT_PER_MINUTE -e ORBIT_RATE_LIMIT_BURST -e ORBIT_DATA_DIR -e ORBIT_ENABLE_DEMO_MODEL -v "$PWD/release-data:/var/lib/orbit" orbit-ai:release
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/ready >/tmp/ready.json && cat /tmp/ready.json && exit 0
            sleep 2
          done
          docker logs orbit-release
          exit 1
      - name: Authentication regression
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/v1/metrics)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Authorization: Bearer invalid-token' http://127.0.0.1:8787/v1/metrics)" = "401"
          curl --fail --silent -H "Authorization: Bearer $ORBIT_API_TOKEN" http://127.0.0.1:8787/v1/metrics | grep -q '"requests_total"'
          curl --fail --silent -H "Authorization: Bearer $ORBIT_API_TOKEN" http://127.0.0.1:8787/v1/session | grep -q '"authenticated":true'
      - name: Dashboard and health regression
        run: |
          curl --fail --silent http://127.0.0.1:8787/health | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8787/ready | grep -q '"ready":true'
          curl --fail --silent -H 'Accept: text/html' http://127.0.0.1:8787/ | grep -q 'ORBIT'
      - name: Model and inference regression
        run: |
          models=$(curl --fail --silent -H "Authorization: Bearer $ORBIT_API_TOKEN" http://127.0.0.1:8787/v1/models)
          echo "$models" | grep -q 'orbit-demo'
          response=$(curl --fail --silent -H "Authorization: Bearer $ORBIT_API_TOKEN" -H 'Content-Type: application/json' -d '{"model":"orbit-demo","messages":[{"role":"user","content":"release smoke test"}]}' http://127.0.0.1:8787/v1/chat/completions)
          echo "$response" | grep -q '"object":"chat.completion"'
      - name: Backup and checksum regression
        run: |
          chmod +x scripts/backup_data.sh scripts/restore_data.sh
          ./scripts/backup_data.sh release-data release-backups
          archive=$(ls release-backups/*.tar.gz)
          sha256sum --check "$archive.sha256"
          mkdir -p restored-data
          ./scripts/restore_data.sh "$archive" restored-data
          grep -q 'release-gate-request' restored-data/requests.jsonl
      - name: Graceful shutdown regression
        run: |
          docker kill --signal=TERM orbit-release
          test "$(docker wait orbit-release)" = "0"
          test -s release-data/requests.jsonl
      - name: Final cleanup
        if: always()
        run: docker rm -f orbit-release 2>/dev/null || true
