name: Container Smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t orbit-ai:smoke .
      - run: docker run -d --name orbit-smoke -p 8787:8787 orbit-ai:smoke
      - name: Wait for service
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs orbit-smoke
          exit 1
      - name: Smoke endpoints
        run: |
          set -e
          curl --fail --silent http://127.0.0.1:8787/ | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8787/health | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8787/ready | grep -q '"status":"ready"'
          curl --fail --silent http://127.0.0.1:8787/docs | grep -q 'ORBIT'
          curl --fail --silent http://127.0.0.1:8787/v1/metrics | grep -q 'orbit_requests_total'
      - name: Concurrent health load
        run: |
          seq 1 40 | xargs -n1 -P10 -I{} curl --fail --silent http://127.0.0.1:8787/health >/dev/null
      - name: Container logs on failure
        if: failure()
        run: docker logs orbit-smoke
      - name: Stop container
        if: always()
        run: docker rm -f orbit-smoke
