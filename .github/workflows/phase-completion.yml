name: Phase Completion Gate

on:
  push:
    branches: [phase-completion]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run phase gate tests
        run: python -m pytest -q tests/test_phase_gate.py
