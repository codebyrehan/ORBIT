[build-system]
requires = ["hatchling>=1.25", "build>=1.2"]
build-backend = "hatchling.build"

[project]
name = "orbit-ai"
version = "0.1.0.dev0"
description = "A local-first AI operating environment"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "ORBIT contributors" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff==0.16.4",
  "mypy>=1.10",
  "httpx>=0.27,<1",
]

[project.scripts]
orbit = "orbit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
from-first = false
force-sort-within-sections = false

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orbit"]
